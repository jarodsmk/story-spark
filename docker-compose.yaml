version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: storyspark-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=storyspark

  storyspark:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: storyspark-app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB_NAME=storyspark
      - PORT=3001
    depends_on:
      - mongodb

volumes:
  mongodb_data:
    driver: local
